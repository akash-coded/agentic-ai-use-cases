name: Simulator Arena

# Grades lab/drill submissions posted as discussion comments and records
# maintainer assignments. SECURITY (unchanged): the grading job has no token
# and runs submissions in a network-isolated, resource-capped container; the
# comment body only ever travels via env; the reply job never touches the
# code; hidden checks never run here.

on:
  discussion_comment:
    types: [created]

permissions: {}

jobs:
  parse:
    if: |
      github.event.discussion.category.slug == 'hands-on-labs' &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      (contains(github.event.comment.body, '/lab ') ||
       contains(github.event.comment.body, '/drill ') ||
       contains(github.event.comment.body, '/assign') ||
       contains(github.event.comment.body, '/leaderboard') ||
       contains(github.event.comment.body, '/progress'))
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    outputs:
      mode:   ${{ steps.parse.outputs.mode }}
      found:  ${{ steps.parse.outputs.found }}
      lab:    ${{ steps.parse.outputs.lab }}
      reason: ${{ steps.parse.outputs.reason }}
      detail: ${{ steps.parse.outputs.detail }}
      assign: ${{ steps.parse.outputs.assign }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: python3 .github/scripts/parse_submission.py
      - if: steps.parse.outputs.mode == 'grade' && steps.parse.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with: { name: submission, path: sub/solution.py, retention-days: 1 }

  grade:
    needs: parse
    if: needs.parse.outputs.mode == 'grade' && needs.parse.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: submission, path: sub }
      - name: Grade in a network-isolated container
        env: { LAB: "${{ needs.parse.outputs.lab }}" }
        run: |
          mkdir -p result
          docker run --rm --network none --memory 512m --cpus 1 --pids-limit 128 \
            --read-only --tmpfs /tmp:size=32m \
            -e PYTHONDONTWRITEBYTECODE=1 -e NO_COLOR=1 \
            -v "$PWD:/repo:ro" -w /repo python:3.12-slim \
            timeout --signal=KILL 45 \
              python3 labs/runner/labctl.py grade --lab "$LAB" --file /repo/sub/solution.py \
                --phases public,break --json > result/report.json || true
          [ -s result/report.json ] || printf '{"lab":"%s","ok":false,"phases":{"public":{"ran":false,"passed":0,"total":0,"error":"the submission timed out or crashed the sandbox","checks":[]}}}' "$LAB" > result/report.json
      - uses: actions/upload-artifact@v4
        with: { name: report, path: result/report.json, retention-days: 1 }

  reply:
    needs: [parse, grade]
    if: always() && needs.parse.outputs.mode == 'grade' && needs.parse.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions: { discussions: write }
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: report, path: result }
      - env:
          LAB: ${{ needs.parse.outputs.lab }}
          LEARNER: ${{ github.event.comment.user.login }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
        run: python3 .github/scripts/format_reply.py result/report.json > reply.md
      - env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          COMMENT_ID: ${{ github.event.comment.node_id }}
        run: |
          gh api graphql -F discussionId="$DISCUSSION_ID" -F replyToId="$COMMENT_ID" -F body=@reply.md -f query='
            mutation($discussionId:ID!,$replyToId:ID!,$body:String!){
              addDiscussionComment(input:{discussionId:$discussionId,replyToId:$replyToId,body:$body}){comment{url}}}' \
            --jq '.data.addDiscussionComment.comment.url'

  assign:
    needs: parse
    if: needs.parse.outputs.mode == 'assign' && needs.parse.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions: { discussions: write }
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - env:
          ASSIGN_JSON: ${{ needs.parse.outputs.assign }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
        run: python3 .github/scripts/format_assignment.py > reply.md
      - env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          COMMENT_ID: ${{ github.event.comment.node_id }}
        run: |
          gh api graphql -F discussionId="$DISCUSSION_ID" -F replyToId="$COMMENT_ID" -F body=@reply.md -f query='
            mutation($discussionId:ID!,$replyToId:ID!,$body:String!){
              addDiscussionComment(input:{discussionId:$discussionId,replyToId:$replyToId,body:$body}){comment{url}}}' >/dev/null

  board:
    needs: parse
    if: (needs.parse.outputs.mode == 'leaderboard' || needs.parse.outputs.mode == 'progress') && needs.parse.outputs.found == 'true'
    runs-on: ubuntu-latest
    permissions: { discussions: write }
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.parse.outputs.mode }}
          LEARNER: ${{ github.event.comment.user.login }}
        run: |
          if [ "$MODE" = "leaderboard" ]; then python3 .github/scripts/sync_boards.py --leaderboard > reply.md
          else python3 .github/scripts/sync_boards.py --progress "$LEARNER" > reply.md; fi
      - env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          COMMENT_ID: ${{ github.event.comment.node_id }}
        run: |
          gh api graphql -F discussionId="$DISCUSSION_ID" -F replyToId="$COMMENT_ID" -F body=@reply.md -f query='
            mutation($discussionId:ID!,$replyToId:ID!,$body:String!){
              addDiscussionComment(input:{discussionId:$discussionId,replyToId:$replyToId,body:$body}){comment{url}}}' >/dev/null

  nudge:
    needs: parse
    if: needs.parse.outputs.found == 'false' && needs.parse.outputs.reason != 'no-trigger'
    runs-on: ubuntu-latest
    permissions: { discussions: write }
    timeout-minutes: 2
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
          COMMENT_ID: ${{ github.event.comment.node_id }}
          REASON: ${{ needs.parse.outputs.reason }}
          DETAIL: ${{ needs.parse.outputs.detail }}
        run: |
          B="https://github.com/akash-coded/aws-bedrock-agentcore-strands/blob/main"
          case "$REASON" in
            unknown-lab)          MSG="I do not recognise that id. The catalogue is in [PATHWAY.md]($B/labs/PATHWAY.md); drills are numbered 1xx (e.g. \`AGL-101\`)." ;;
            no-code)              MSG="I found the trigger line but no \`\`\`python code block. Put your solution in one." ;;
            many-fences)          MSG="More than one \`\`\`python block — I cannot tell which is the submission. One per comment, please." ;;
            too-long)             MSG="That is over 20 KB. A solution should be far smaller — check you pasted only the function." ;;
            empty-code)           MSG="The code block is empty." ;;
            assign-not-allowed)   MSG="Only maintainers can \`/assign\`. If you want to work through these, just post \`/drill <ID>\` with your code." ;;
            assign-no-learners)   MSG="\`/assign\` needs at least one \`@login\`." ;;
            assign-no-items)      MSG="\`/assign\` needs at least one lab or drill id, e.g. \`AGL-101\`." ;;
            assign-unknown-items) MSG="Unknown id(s): \`$DETAIL\`. See [PATHWAY.md]($B/labs/PATHWAY.md)." ;;
            *) exit 0 ;;
          esac
          printf '%s\n\n<sub>Formats: `/drill ID` or `/lab ID` + one ```python block · maintainers: `/assign @user ID … --session "…" --due YYYY-MM-DD` · [how this works](%s/labs/ARENA.md)</sub>\n' "$MSG" "$B" > nudge.md
          gh api graphql -F discussionId="$DISCUSSION_ID" -F replyToId="$COMMENT_ID" -F body=@nudge.md -f query='
            mutation($discussionId:ID!,$replyToId:ID!,$body:String!){
              addDiscussionComment(input:{discussionId:$discussionId,replyToId:$replyToId,body:$body}){comment{url}}}' >/dev/null
