name: Pulse & Scoreboard

# Rebuilds the live Scoreboard wiki page from the Arena's own replies, and —
# when the PROJECT_TOKEN secret exists — the Hands-on Tracker and Repo Pulse
# boards. The scoreboard lives on the wiki rather than main on purpose: it is
# derived, changes every few hours, and the main ruleset (rightly) does not let
# a bot push past the required checks.
# GITHUB_TOKEN cannot access Projects v2, so the boards need a fine-grained
# PAT with Projects read/write stored as PROJECT_TOKEN. Without it, only the
# scoreboard updates, and the run says so.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Simulator Arena"]
    types: [completed]

permissions:
  contents: write   # for the wiki, not main
  discussions: read
  issues: read
  pull-requests: read

concurrency: { group: pulse, cancel-in-progress: true }

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Rebuild the scoreboard (and boards, if a token exists)
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: python3 .github/scripts/sync_boards.py --boards --scoreboard out/Scoreboard.md
      - name: Publish it to the wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-live
          cp out/Scoreboard.md wiki-live/Scoreboard.md
          cd wiki-live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add Scoreboard.md && git commit -q -m "Rebuild scoreboard from Arena replies" && git push -q
            echo "published: https://github.com/${GITHUB_REPOSITORY}/wiki/Scoreboard"
          else
            echo "scoreboard unchanged"
          fi
